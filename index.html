    <script>
      // Paint in the stored theme before React boots, so "Automático" on a light phone
      // does not flash the dark shell. Mirrors applyTheme() in src/stores/settings.ts.
      try {
        var saved = JSON.parse(localStorage.getItem("cc.settings") || "{}");
        var theme = (saved.state && saved.state.theme) || "dark";
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#121216" : "#f8f7f4");
        var motion = (saved.state && saved.state.motion) || "system";
        var reduced = motion === "reduced" || (motion === "system" && matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.dataset.motion = reduced ? "reduced" : "full";
      } catch (e) {}
    </script>
